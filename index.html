// === ブランドDB ===

// === タイトル解析関数 ===
function extractWeight(title) {
  // 「3kg×2袋」「500g×3」のような乗算パターン
  const multi = /(\d+(?:\.\d+)?)\s*(kg|ｋｇ|キロ|g|ｇ|グラム)\s*[×x*✕✖]\s*(\d+)/i.exec(title);
  if (multi) {
    const unit = multi[2].toLowerCase();
    const w = parseFloat(multi[1]);
    const c = parseInt(multi[3]);
    const grams = (unit === 'kg' || unit === 'ｋｇ' || unit === 'キロ') ? w * 1000 : w;
    return grams * c;
  }
  // 通常の単発: 一番大きい数字+kg/gを採用
  const matches = [...title.matchAll(/(\d+(?:\.\d+)?)\s*(kg|ｋｇ|キロ|g|ｇ|グラム)/gi)];
  if (matches.length === 0) return null;
  let maxGrams = 0;
  for (const m of matches) {
    const unit = m[2].toLowerCase();
    const w = parseFloat(m[1]);
    const grams = (unit === 'kg' || unit === 'ｋｇ' || unit === 'キロ') ? w * 1000 : w;
    if (grams > maxGrams) maxGrams = grams;
  }
  return maxGrams > 100 ? maxGrams : null;
}

function detectBrand(title, shopName) {
  const combined = (title || '') + ' ' + (shopName || '');
  // 長い名前から先にマッチさせる
  const brands = Object.keys(BRAND_DB).sort((a, b) => b.length - a.length);
  for (const b of brands) {
    if (combined.toLowerCase().includes(b.toLowerCase())) {
      return b;
    }
  }
  return null;
}

function detectType(title) {
  if (/WPI|アイソレート|isolate/i.test(title)) return 'WPI';
  if (/カゼイン|casein/i.test(title)) return 'カゼイン';
  if (/ソイ|大豆|soy/i.test(title)) return 'ソイ';
  return 'WPC';
}

  { match: /ほうじ茶|hojicha/i,                                 cat: '和風',       name: 'ほうじ茶' },
  { match: /黒蜜|和風/i,                                        cat: '和風',       name: '和風' },
  { match: /バニラ|vanilla/i,                                   cat: 'バニラ',     name: 'バニラ' },
  { match: /ミルクティー|milk tea/i,                            cat: 'デザート',   name: 'ミルクティー' },
  { match: /クッキー|cookie/i,                                  cat: 'デザート',   name: 'クッキー&クリーム' },
  { match: /キャラメル|caramel/i,                               cat: 'デザート',   name: 'キャラメル' },
  { match: /メイプル|maple/i,                                   cat: 'デザート',   name: 'メイプル' },
  { match: /コーヒー|coffee|モカ|mocha/i,                       cat: 'デザート',   name: 'コーヒー' },
  { match: /ナチュラル|プレーン|無味|natural|plain|unflavor/i,  cat: 'ナチュラル', name: 'プレーン' },
];

function detectFlavor(title) {
  for (const r of FLAVOR_RULES) {
    if (r.match.test(title)) return { category: r.cat, name: r.name };
  }
  return { category: 'その他', name: '不明' };
}

function detectSweetenerFree(title) {
  return /甘味料.{0,4}(不使用|なし|無添加)|人工甘味料.{0,4}(不使用|なし)|ナチュラル|プレーン|無味/i.test(title);
}

// === 楽天API呼び出し（Vercel上の中継APIを叩く・CORS問題なし） ===
async function loadRakutenData() {
  const url = '/api/products?keyword=' + encodeURIComponent(SEARCH_KEYWORD);
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!response.ok) {
      const bodyText = await response.text().catch(() => '');
      throw new Error(`サーバーエラー HTTP ${response.status}: ${bodyText.slice(0, 200)}`);
    }
    const data = await response.json();
    return data;
  } finally {
    clearTimeout(timeoutId);
  }
}

function getLargeImageUrl(url) {
  if (!url) return null;
  // 楽天画像URLのサイズ指定を大きくする
  return url.replace(/_ex=\d+x\d+/, '_ex=300x300');
}

function convertItem(rakutenItem) {
  const item = rakutenItem.Item || rakutenItem;
  const title = item.itemName || '';
  const weight = extractWeight(title);
  if (!weight || weight < 100) return null;

  const brand = detectBrand(title, item.shopName);
  const brandInfo = brand ? BRAND_DB[brand] : { proteinPct: 75, madeIn: '不明', short: null };
  const flavor = detectFlavor(title);

  let imageUrl = null;
  if (item.mediumImageUrls && item.mediumImageUrls.length > 0) {
    const raw = item.mediumImageUrls[0];
    imageUrl = getLargeImageUrl(typeof raw === 'string' ? raw : raw.imageUrl);
  } else if (item.smallImageUrls && item.smallImageUrls.length > 0) {
    const raw = item.smallImageUrls[0];
    imageUrl = getLargeImageUrl(typeof raw === 'string' ? raw : raw.imageUrl);
  }

  return {
    name: title.replace(/【.+?】/g, '').replace(/\[.+?\]/g, '').replace(/\s+/g, ' ').trim(),
    brand: brand || '',
    brandShort: brandInfo.short || (brand || item.shopName || ''),
    shopName: item.shopName || '',
    weight: weight,
    price: parseInt(item.itemPrice) || 0,
    type: detectType(title),
    proteinPct: brandInfo.proteinPct,
    proteinEstimated: !brand,
    flavorCategory: flavor.category,
    flavorName: flavor.name,
    sweetenerFree: detectSweetenerFree(title),
    madeIn: brandInfo.madeIn,
    rating: parseFloat(item.reviewAverage) || 0,
    reviews: parseInt(item.reviewCount) || 0,
    imageUrl: imageUrl,
    itemUrl: item.itemUrl,
  };
}

// === 状態 ===
let products = [];
let activeType = "all";
let activeFlavor = "all";
let activeMadeIn = "all";
let searchText = "";
let sortMode = "gram-price";

// === ヘルパー ===
function computeRanks(list, key, ascending = true) {
  const sorted = [...list].sort((a, b) => ascending ? a[key] - b[key] : b[key] - a[key]);
  const rankMap = new Map();
  sorted.forEach((p, i) => rankMap.set(p, i + 1));
  return rankMap;
}

function renderStars(rating) {
  let stars = "";
  for (let i = 0; i < 5; i++) {
    stars += i < Math.round(rating) ? "★" : "☆";
  }
  return stars;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// === レンダリング ===
function render() {
  let filtered = products.filter(p => {
    if (activeType !== "all" && p.type !== activeType) return false;
    if (activeFlavor !== "all" && p.flavorCategory !== activeFlavor) return false;
    if (activeMadeIn !== "all" && p.madeIn !== activeMadeIn) return false;
    if (searchText) {
      const q = searchText.toLowerCase();
      if (!p.name.toLowerCase().includes(q) && !p.brand.toLowerCase().includes(q) && !p.shopName.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const rankProteinPrice = computeRanks(filtered, "pricePerProtein", true);
  const rankGramPrice = computeRanks(filtered, "pricePerGram", true);
  const rankTotalLow = computeRanks(filtered, "price", true);
  const rankProteinPct = computeRanks(filtered, "proteinPct", false);
  const rankRating = computeRanks(filtered, "rating", false);

  filtered.sort((a, b) => {
    switch(sortMode) {
      case "protein-price": return a.pricePerProtein - b.pricePerProtein;
      case "gram-price":    return a.pricePerGram - b.pricePerGram;
      case "total-low":     return a.price - b.price;
      case "protein-pct":   return b.proteinPct - a.proteinPct;
      case "rating":        return b.rating - a.rating;
    }
  });

  document.getElementById("count").textContent = filtered.length;

  const results = document.getElementById("results");
  if (filtered.length === 0) {
    results.innerHTML = '<div style="text-align:center; padding:60px 20px; color:#888;">該当する商品がありません</div>';
    return;
  }

  const activeRankKey = sortMode === "protein-price" ? "proteinPrice"
                      : sortMode === "gram-price" ? "gramPrice"
                      : sortMode === "total-low" ? "totalLow"
                      : sortMode === "protein-pct" ? "proteinPct"
                      : sortMode === "rating" ? "rating" : null;

  results.innerHTML = filtered.map((p, i) => {
    const rankClass = i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
    const typeClass = p.type === "WPI" ? "wpi" : p.type === "WPC" ? "wpc" : p.type === "ソイ" ? "soy" : "casein";

    const sweetenerBadge = p.sweetenerFree
      ? '<span class="badge sweetener-free">🌿 甘味料なし</span>'
      : '<span class="badge has-sweetener">甘味料あり</span>';
    const madeInBadge = p.madeIn === "国内" ? '<span class="badge made-jp">🇯🇵 国内製造</span>'
                      : p.madeIn === "海外" ? '<span class="badge made-overseas">🌏 海外製造</span>'
                      : '<span class="badge made-unknown">製造国不明</span>';
    const proteinBadge = p.proteinEstimated
      ? `<span class="badge estimated">タンパク質 約${p.proteinPct}%（推定）</span>`
      : `<span class="badge">タンパク質 ${p.proteinPct}%</span>`;

    const imgHtml = p.imageUrl
      ? `<img src="${escapeHtml(p.imageUrl)}" alt="" onerror="this.style.display='none';this.parentElement.innerHTML+='<div class=&quot;product-img-fallback&quot;>🥤</div>'"/>`
      : `<div class="product-img-fallback">🥤</div>`;

    const ranks = [
      { key: "gramPrice",    sortValue: "gram-price",    label: "1kgあたり",     icon: "⚖️", rank: rankGramPrice.get(p) },
      { key: "proteinPrice", sortValue: "protein-price", label: "タンパク質単価", icon: "💪", rank: rankProteinPrice.get(p) },
      { key: "totalLow",     sortValue: "total-low",     label: "値段",           icon: "💴", rank: rankTotalLow.get(p) },
      { key: "proteinPct",   sortValue: "protein-pct",   label: "含有率",         icon: "🧬", rank: rankProteinPct.get(p) },
      { key: "rating",       sortValue: "rating",        label: "評価",           icon: "⭐", rank: rankRating.get(p) },
    ];
    const rankBadgesHtml = ranks.map(r => {
      const isActive = r.key === activeRankKey;
      const isTop1 = r.rank === 1;
      const cls = ["rank-badge", isActive ? "active" : "", isTop1 ? "top1" : ""].filter(Boolean).join(" ");
      return `<span class="${cls}" data-sort="${r.sortValue}" title="クリックでこの順位に並び替え"><span class="rank-icon">${r.icon}</span>${r.label} <span class="rank-num">${r.rank}位</span></span>`;
    }).join("");

    return `
      <a class="card" href="${escapeHtml(p.itemUrl)}" target="_blank" rel="noopener">
        <div class="rank ${rankClass}">${i + 1}</div>
        <div class="product-img">${imgHtml}</div>
        <div class="info">
          <div class="product-name">${escapeHtml(p.name)}</div>
          <div class="product-meta">${escapeHtml(p.brandShort || p.shopName)} / ${p.weight >= 1000 ? (p.weight/1000).toFixed(p.weight%1000?1:0)+'kg' : p.weight+'g'}</div>
          <div class="rating-row">
            <span class="stars">${renderStars(p.rating)}</span>
            <span class="rating-num">${p.rating.toFixed(1)}</span>
            <span class="review-count">(${p.reviews.toLocaleString()}件)</span>
          </div>
          <div class="badges">
            <span class="badge ${typeClass}">${p.type}</span>
            ${proteinBadge}
            <span class="badge">${escapeHtml(p.flavorName)}</span>
            ${madeInBadge}
            ${sweetenerBadge}
          </div>
          <div class="rank-badges">${rankBadgesHtml}</div>
        </div>
        <div class="price-block">
          <div>
            <div class="pp-protein">¥${Math.round(p.pricePerKg).toLocaleString()}</div>
            <div class="pp-protein-label">1kgあたり</div>
          </div>
          <div class="price-detail">
            値段 <strong>¥${p.price.toLocaleString()}</strong><br>
            タンパク質1gあたり ¥${p.pricePerProtein.toFixed(2)}<br>
            タンパク質量 ${p.proteinGram}g
          </div>
        </div>
      </a>
    `;
  }).join("");
}

// === データ読込 ===
async function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display = 'none';
  document.getElementById('main-content').style.display = 'none';

  try {
    const data = await loadRakutenData();
    if (data.error) {
      throw new Error(`楽天API: ${data.error_description || data.error}`);
    }
    if (!data.Items || !Array.isArray(data.Items)) {
      throw new Error('予期しないデータ形式');
    }

    products = data.Items.map(convertItem).filter(p => p !== null);

    products.forEach(p => {
      p.proteinGram = Math.round(p.weight * p.proteinPct / 100);
      p.pricePerGram = p.price / p.weight;
      p.pricePerKg = p.price / (p.weight / 1000);
      p.pricePerProtein = p.price / p.proteinGram;
    });

    if (products.length === 0) {
      throw new Error('内容量を解析できる商品が見つかりませんでした');
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    render();
  } catch (e) {
    console.error(e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error-detail').textContent = e.message;
  }
}

// === イベント ===
document.getElementById("search").addEventListener("input", e => {
  searchText = e.target.value;
  render();
});
document.querySelectorAll("#type-filters .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll("#type-filters .chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeType = chip.dataset.type;
    render();
  });
});
document.querySelectorAll("#flavor-filters .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll("#flavor-filters .chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeFlavor = chip.dataset.flavor;
    render();
  });
});
document.querySelectorAll("#madein-filters .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll("#madein-filters .chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeMadeIn = chip.dataset.madein;
    render();
  });
});
document.getElementById("sort").addEventListener("change", e => {
  sortMode = e.target.value;
  render();
});
document.getElementById("results").addEventListener("click", e => {
  const badge = e.target.closest(".rank-badge");
  if (!badge) return;
  e.preventDefault();
  e.stopPropagation();
  const newSort = badge.dataset.sort;
  if (!newSort) return;
  sortMode = newSort;
  document.getElementById("sort").value = newSort;
  render();
  window.scrollTo({ top: document.querySelector(".sort-bar").offsetTop - 20, behavior: "smooth" });
});

// 初回ロード
loadData();
</script>
